<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
        .map-container {
            height: 60vh;
            position: relative;
            overflow: hidden;
        }
        
        /* Simulated route and bus animation */
        .route-line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 4px;
            background-color: #002447; /* primary */
            border-radius: 2px;
            transform: translateY(-50%) rotate(-15deg);
        }
        
        .bus-marker {
            position: absolute;
            top: calc(50% - 24px);
            left: 10%;
            width: 48px;
            height: 48px;
            background-color: #F5A623; /* Amber accent */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
            animation: moveBus 8s linear infinite alternate;
            z-index: 10;
        }

        .bus-marker .material-symbols-outlined {
            color: #1b1c1c; /* on-surface */
            font-size: 24px;
        }

        @keyframes moveBus {
            0% {
                transform: translate(0, 0) translateY(-50%) rotate(-15deg);
            }
            100% {
                transform: translate(80vw, -20vw) translateY(-50%) rotate(-15deg);
            }
        }

        .stop-marker {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #ffffff;
            border: 4px solid #002447;
            border-radius: 50%;
            z-index: 5;
        }
        
        .stop-1 { top: calc(50% - 6px); left: 10%; transform: translateY(-50%) rotate(-15deg) translateX(0); }
        .stop-2 { top: calc(50% - 6px); left: 50%; transform: translateY(-50%) rotate(-15deg) translateY(-8vw); }
        .stop-3 { top: calc(50% - 6px); left: 90%; transform: translateY(-50%) rotate(-15deg) translateY(-16vw); }

    </style>
</head>
