[package]
name = "schoolpilot-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SchoolPilot lab relay — carries a published CBT exam into a room with no internet"
license = "proprietary"

[lib]
name = "schoolpilot_relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
flate2 = "1"
getrandom = "0.2"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-manual-roots"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object key order as the server wrote it. The bundle's
# AAD depends on byte-exact header JSON, so this is load-bearing, not cosmetic
# — see bundle::Envelope and the note on raw AAD capture.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tao = "0.36"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wry = "0.48"

[dependencies.aes-gcm]
version = "0.10"
features = ["aes"]

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

[profile.release]
# These machines are old and the installer may travel on a phone hotspot
# (docs/offline-cbt-client.md §16). Size matters more than the last 5% of speed.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
