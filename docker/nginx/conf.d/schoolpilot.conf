# SchoolPilot edge configuration.
#
# One hostname serves two applications. Anything under /api/ (plus the file
# routes Laravel owns) is handed to php-fpm; everything else is the Next.js
# admin. They share an origin on purpose — the web app's session cookie is
# httpOnly and same-origin, so a split-origin setup would mean either CORS with
# credentials or moving the token somewhere the page can read it.
#
# Tenancy note: SchoolPilot resolves the school from the request host
# (*.schoolpilot.ng). Every proxy and FastCGI hop below therefore forwards the
# original Host untouched. Rewriting it to an upstream name would collapse
# every school onto one tenant.

# "upgrade" only when the client actually asked for one. Hardcoding it would
# send Connection: upgrade on ordinary requests too, which defeats the
# keepalive pool on the frontend upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream php_backend {
    server backend:9000;
}

upstream web_frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Wildcard: one server block serves every tenant subdomain.
    server_name _;

    root /var/www/backend/public;
    index index.php;

    charset utf-8;

    # CBT question images and bulk student CSV imports are the large uploads.
    # The default 1M rejects a class photo.
    client_max_body_size 25M;

    # Report-card PDF generation and broadsheet compilation are slow by nature;
    # 60s matches the PHP-FPM request timeout rather than cutting in ahead of it.
    fastcgi_read_timeout 60s;
    proxy_read_timeout 60s;

    # Data cost is a product constraint, not a micro-optimisation — see doc §12.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # Laravel
    # ---------------------------------------------------------------------

    # ^~ so these win over the regex location below without further matching.
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # The tenant. Without this the school cannot be resolved and every
        # request 404s at TenantResolutionMiddleware.
        fastcgi_param HTTP_HOST $http_host;

        # Real client IP, so the login rate limiter throttles the attacker
        # rather than this container.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Nothing else in the Laravel document root is executable or servable.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---------------------------------------------------------------------
    # Next.js admin — everything not claimed above
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
