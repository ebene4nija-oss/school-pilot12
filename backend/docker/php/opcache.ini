; Production opcache settings.
;
; validate_timestamps=0 means PHP never stats the source files looking for
; edits — the fastest setting, and correct here because the code is baked into
; an immutable image. A code change means a new image, not a file edit, so
; there is nothing to notice.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
