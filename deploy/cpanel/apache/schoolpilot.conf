# SchoolPilot — cPanel vhost include.
#
# This is the Apache translation of docker/nginx/conf.d/schoolpilot.conf, and
# it preserves that file's central decision: one hostname serves two
# applications. Anything under /api/ or /storage/ is Laravel (served straight
# from the document root by mod_php/php-fpm and backend/public/.htaccess);
# everything else is proxied to the Next.js server on loopback.
#
# They share an origin on purpose. The web app's session cookie is httpOnly
# and same-origin, so splitting the API onto api.schoolpilot.org.ng would mean
# either credentialed CORS or moving the token somewhere the page can read it.
# Do not "simplify" this by giving the API its own subdomain.
#
# INSTALLATION — do not paste this into httpd.conf. cPanel rebuilds that file
# on every update and your changes disappear, typically in the middle of term.
# Install it as a userdata include instead:
#
#   install -D -m 0644 apache/schoolpilot.conf \
#     /etc/apache2/conf.d/userdata/std/2_4/schoolpilot/schoolpilot.org.ng/schoolpilot.conf
#   install -D -m 0644 apache/schoolpilot.conf \
#     /etc/apache2/conf.d/userdata/ssl/2_4/schoolpilot/schoolpilot.org.ng/schoolpilot.conf
#   /scripts/ensure_vhost_includes --user=schoolpilot
#   /scripts/rebuildhttpdconf && systemctl restart httpd
#
# Both copies are needed: the std tree covers :80, the ssl tree covers :443,
# and only the second one carries real traffic once the redirect below is live.

# --- Tenancy ---------------------------------------------------------------
#
# SchoolPilot resolves the school from the request Host (*.schoolpilot.org.ng) in
# TenantResolutionMiddleware. Every proxy hop must forward the original Host
# untouched; rewriting it to the upstream name collapses every school in the
# country onto one tenant.
ProxyPreserveHost On

# Laravel reads this to build absolute URLs (password-reset links, report-card
# download links) and to decide whether to mark cookies Secure. Apache
# terminates TLS here, so the proxied request to Node is plain http and Next.js
# would otherwise conclude the site is insecure.
RequestHeader set X-Forwarded-Proto "https" env=HTTPS

# --- What Laravel owns -----------------------------------------------------
#
# "!" means "do not proxy this" — serve it from the document root, which is
# backend/public, where .htaccess routes it into index.php. These lines must
# come before the catch-all: mod_proxy takes the first match.
ProxyPass /api            !
ProxyPass /storage        !
ProxyPass /index.php      !

# Laravel's own liveness endpoint (bootstrap/app.php: health: '/up').
#
# This is the only health check that works on the apex domain. Everything
# under /api/v1/ runs through TenantResolutionMiddleware, which reads the
# first host label as a school subdomain — so https://schoolpilot.org.ng/api/v1/health
# resolves "schoolpilot", finds no such school, and returns 404. That 404 is
# correct behaviour, not a fault. Probe /up instead.
ProxyPass /up             !

# AutoSSL and acme.sh both validate over HTTP by writing into this path. If it
# is proxied to Next.js, renewal fails silently and the certificate expires.
ProxyPass /.well-known    !

# --- Everything else is the Next.js admin ----------------------------------
#
# 127.0.0.1 only. The Node server has no auth of its own and must never be
# reachable from outside the box — see systemd/schoolpilot-web.service.
ProxyPass        / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/

# Report-card PDF generation and broadsheet compilation are slow by nature.
# 60s matches the PHP max_execution_time set in the MultiPHP INI Editor rather
# than cutting in ahead of it and returning a 504 for work that then completes.
ProxyTimeout 60

# --- Upload ceiling --------------------------------------------------------
#
# CBT question images and bulk student CSV imports are the large uploads.
# 25 MiB, matching client_max_body_size in the nginx config. Apache's default
# is unlimited, but PHP's upload_max_filesize still applies and must be raised
# to match in the MultiPHP INI Editor or uploads fail at the PHP layer instead.
LimitRequestBody 26214400

# --- Headers ---------------------------------------------------------------
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Data cost is a product constraint, not a micro-optimisation — see doc §12.
# Many parents are on metered mobile data. Next.js already gzips its own
# responses (compress: true in next.config.ts); this covers Laravel's JSON.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/javascript application/json \
        application/xml image/svg+xml text/css text/javascript text/plain
</IfModule>

# Nothing in the Laravel document root other than the front controller is
# executable or servable. .well-known is exempt so certificate renewal works.
<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>
