<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SchoolPilot - Empty Student List</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Work+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f6f3f2",
                        "surface": "#fcf9f8",
                        "tertiary-fixed": "#c0eec7",
                        "on-secondary-fixed-variant": "#633f00",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#6a9472",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e4e2e1",
                        "on-primary-fixed": "#001c39",
                        "outline-variant": "#c3c6cf",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#446086",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#303030",
                        "inverse-primary": "#acc8f4",
                        "secondary-fixed-dim": "#f9bb65",
                        "surface-container": "#f0edec",
                        "on-tertiary-fixed": "#00210c",
                        "primary-fixed-dim": "#acc8f4",
                        "tertiary": "#001105",
                        "surface-bright": "#fcf9f8",
                        "tertiary-container": "#002a11",
                        "primary": "#000e22",
                        "secondary": "#835500",
                        "secondary-fixed": "#ffddb4",
                        "surface-container-high": "#eae7e7",
                        "surface-dim": "#dcd9d8",
                        "inverse-on-surface": "#f3f0ef",
                        "on-primary-fixed-variant": "#2c486d",
                        "primary-fixed": "#d4e3ff",
                        "on-error-container": "#93000a",
                        "on-background": "#1b1c1b",
                        "tertiary-fixed-dim": "#a5d1ac",
                        "on-primary-container": "#718cb5",
                        "on-surface": "#1b1c1b",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#274f32",
                        "on-surface-variant": "#43474e",
                        "on-secondary-container": "#784d00",
                        "on-secondary-fixed": "#291800",
                        "primary-container": "#002447",
                        "outline": "#74777f",
                        "background": "#fcf9f8",
                        "secondary-container": "#ffc16a",
                        "surface-variant": "#e4e2e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "8px",
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "screen-margin": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-sm": ["Work Sans"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-lg": ["Work Sans"],
                        "headline-lg-mobile": ["Work Sans"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Work Sans"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Mobile safe areas */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:hidden selection:bg-primary-container selection:text-on-primary">
<!-- TopAppBar -->
<header class="bg-surface h-[56px] w-full sticky top-0 z-50 border-b border-outline-variant pt-safe flex items-center justify-between px-screen-margin shadow-sm">
<button aria-label="Menu" class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 -ml-2 rounded-full flex items-center justify-center active:scale-95 duration-100">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary truncate flex-1 text-center">Students</h1>
<button aria-label="Notifications" class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 -mr-2 rounded-full flex items-center justify-center active:scale-95 duration-100">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pb-[96px]"> <!-- padding bottom for nav bar -->
<!-- Sticky Subheader / Count Bar -->
<div class="sticky top-[56px] z-40 bg-surface/90 backdrop-blur-sm border-b border-outline-variant px-screen-margin py-unit flex justify-between items-center">
<p class="font-label-lg text-label-lg text-on-surface-variant">0 students · JSS2A shown</p>
<button aria-label="Filter" class="text-primary-container p-1 rounded hover:bg-surface-container-high transition-colors flex items-center">
<span class="material-symbols-outlined text-[20px]">filter_list</span>
</button>
</div>
<!-- Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center px-screen-margin py-stack-lg text-center mt-8">
<div class="w-48 h-48 mb-stack-md rounded-full bg-surface-container-low flex items-center justify-center border border-outline-variant shadow-sm relative overflow-hidden">
<div class="absolute inset-0 bg-secondary/5 opacity-50"></div>
<span class="material-symbols-outlined text-[80px] text-outline-variant font-light relative z-10" style="font-variation-settings: 'wght' 200;">group_off</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-unit">No students in JSS2A yet</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mb-stack-lg">
                This class is currently empty. Start adding students to build your roster.
            </p>
<button class="h-[48px] bg-secondary-container text-on-background font-label-lg text-label-lg px-6 rounded-full flex items-center gap-2 hover:bg-[#ffb042] transition-colors active:scale-95 shadow-sm border border-secondary/20">
<span class="material-symbols-outlined text-[20px] fill-icon">person_add</span>
                Add student
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-[80px] border-t border-outline-variant flex justify-around items-center bg-surface px-unit pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">
<!-- Home -->
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-16 h-full hover:bg-surface-container-low transition-all duration-200 ease-in-out group rounded-xl my-1" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<!-- Students (Active) -->
<a aria-current="page" class="flex flex-col items-center justify-center gap-1 text-primary-container bg-secondary-container w-20 h-14 rounded-full transition-all duration-200 ease-in-out my-auto shadow-sm border border-secondary/10" href="#">
<span class="material-symbols-outlined text-[24px] fill-icon">group</span>
<span class="font-label-sm text-label-sm font-semibold">Students</span>
</a>
<!-- Fees -->
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-16 h-full hover:bg-surface-container-low transition-all duration-200 ease-in-out group rounded-xl my-1" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">payments</span>
<span class="font-label-sm text-label-sm">Fees</span>
</a>
<!-- Staff -->
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-16 h-full hover:bg-surface-container-low transition-all duration-200 ease-in-out group rounded-xl my-1" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">badge</span>
<span class="font-label-sm text-label-sm">Staff</span>
</a>
<!-- More -->
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-16 h-full hover:bg-surface-container-low transition-all duration-200 ease-in-out group rounded-xl my-1" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">more_horiz</span>
<span class="font-label-sm text-label-sm">More</span>
</a>
</nav>
</body></html>
