<body class="bg-surface-bright min-h-screen flex items-center justify-center p-screen-margin font-body-lg text-body-lg text-on-surface">
<main class="w-full max-w-[400px] flex flex-col gap-stack-lg">
<!-- Header Section -->
<header class="text-center flex flex-col items-center gap-stack-sm mb-stack-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">SchoolPilot</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Administrative Portal</p>
</header>
<!-- Login Card -->
<div class="bg-on-primary border border-outline-variant rounded-xl p-stack-lg flex flex-col gap-stack-md">
<!-- Institution Chip -->
<div class="flex justify-center mb-stack-sm">
<div class="inline-flex items-center gap-unit px-3 py-1.5 bg-surface-container rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-sm text-label-sm text-on-surface">Graceland College</span>
</div>
</div>
<div class="font-headline-sm text-headline-sm text-center text-primary mb-stack-sm">
                Sign In
            </div>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative">
<input class="block px-4 pb-2 pt-6 w-full text-on-surface bg-surface-bright rounded-DEFAULT border border-outline-variant appearance-none focus:outline-none focus:ring-0 focus:border-primary-container focus:border-2 peer" id="email" placeholder=" " required="" type="email" value="admin@graceland.edu"/>
<label class="absolute font-body-md text-body-md text-on-surface-variant duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-primary-container peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="relative">
<input class="block px-4 pb-2 pt-6 w-full text-on-surface bg-surface-bright rounded-DEFAULT border border-error appearance-none focus:outline-none focus:ring-0 focus:border-error focus:border-2 peer" id="password" placeholder=" " required="" type="password" value="********"/>
<label class="absolute font-body-md text-body-md text-error duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-error peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3" for="password">Password</label>
<button class="absolute right-4 top-4 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Error Message -->
<div class="flex items-center gap-unit text-error font-body-md text-body-md mt-1">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">error</span>
<span>Invalid email or password</span>
</div>
<div class="flex items-center justify-between mt-stack-sm">
<label class="flex items-center gap-unit cursor-pointer">
<input class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline" href="#">Forgot password?</a>
</div>
<!-- Primary Action -->
<button class="mt-stack-sm w-full h-[48px] bg-secondary-container text-on-surface font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-secondary-fixed-dim transition-colors" type="submit">
                    Sign in
                </button>
</form>
