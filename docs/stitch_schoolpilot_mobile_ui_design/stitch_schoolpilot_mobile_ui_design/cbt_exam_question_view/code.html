<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Exam Question View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Work+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#74777f",
                        "primary-fixed": "#d4e3ff",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-container": "#f0edec",
                        "on-tertiary-container": "#6a9472",
                        "on-primary-fixed": "#001c39",
                        "primary-fixed-dim": "#acc8f4",
                        "secondary-fixed": "#ffddb4",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#a5d1ac",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#43474e",
                        "on-secondary-fixed": "#291800",
                        "surface-tint": "#446086",
                        "secondary-fixed-dim": "#f9bb65",
                        "on-primary-fixed-variant": "#2c486d",
                        "outline-variant": "#c3c6cf",
                        "secondary-container": "#ffc16a",
                        "on-secondary-container": "#784d00",
                        "on-tertiary-fixed-variant": "#274f32",
                        "secondary": "#835500",
                        "surface-container-low": "#f6f3f2",
                        "tertiary-fixed": "#c0eec7",
                        "tertiary": "#001105",
                        "on-secondary-fixed-variant": "#633f00",
                        "on-background": "#1b1c1b",
                        "primary": "#000e22",
                        "surface-variant": "#e4e2e1",
                        "on-tertiary-fixed": "#00210c",
                        "on-primary-container": "#718cb5",
                        "on-surface": "#1b1c1b",
                        "background": "#fcf9f8",
                        "primary-container": "#002447",
                        "surface-container-highest": "#e4e2e1",
                        "inverse-surface": "#303030",
                        "surface": "#fcf9f8",
                        "surface-dim": "#dcd9d8",
                        "error": "#ba1a1a",
                        "tertiary-container": "#002a11",
                        "inverse-primary": "#acc8f4",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#eae7e7",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fcf9f8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "unit": "8px",
                        "stack-lg": "24px",
                        "screen-margin": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-md": ["Work Sans"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Work Sans"],
                        "headline-lg-mobile": ["Work Sans"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Work Sans"],
                        "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-surface'); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md overflow-hidden bg-background">
<!-- Top App Bar / Progress Shell -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant z-50 flex flex-col">
<!-- Progress Bar -->
<div class="h-1 w-full bg-surface-container-high">
<div class="h-full bg-primary-container" style="width: 30%;"></div>
</div>
<!-- Status Bar -->
<div class="flex justify-between items-center h-16 px-screen-margin w-full">
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm text-on-surface">Question 12 of 40</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded-md border border-outline-variant">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">schedule</span>
<span class="font-mono text-[14px] font-bold text-on-surface tracking-wider">18:42</span>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-screen-margin py-stack-md flex flex-col gap-stack-lg pb-[120px]">
<!-- Question Content -->
<section class="flex flex-col gap-stack-md">
<div class="flex justify-between items-start gap-4">
<h1 class="font-headline-sm text-headline-sm text-on-surface m-0 leading-tight">
                    Find the value of β and the length of side c.
                </h1>
<button class="flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant bg-transparent text-on-surface-variant hover:bg-surface-container-low transition-colors font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[16px]">flag</span>
                    Flag
                </button>
</div>
<!-- Image Asset -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden flex justify-center items-center p-4">
<img alt="Exam Question Diagram" class="max-w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEmqpmXHiFsVFuw1mnBEgMQob5Mbrqu-XRfwuS07xHsw12KCtlxeJk6n6SRWaym25iqdF3OMDALWQCpIW_Xs9_kwRpcIQOU6o9innJP_EdHTrgWb7J1d57-1lnIc8yUZAJu2C3DVs7sfOwix6_UJkCEays6VQwiKFmYP1ZPYNTAICcFo12r9r7gAXr9mzWit4CX4sTWZX_w4CMIZfjvPqHVT3EUVpLXJFJPGJk3-cX0wgywuy4kLeE"/>
</div>
<!-- Context Text -->
<p class="font-body-md text-body-md text-on-surface-variant mt-2">
                Use the Law of Sines: <span class="font-mono bg-surface-container-low px-1 py-0.5 rounded text-sm">\(\frac{a}{\sin \alpha} = \frac{b}{\sin \beta} = \frac{c}{\sin \gamma}\)</span> to solve the triangle given the parameters above.
            </p>
</section>
<!-- Options Container -->
<section class="flex flex-col gap-stack-sm">
<!-- Option A (Unselected) -->
<label class="flex items-center p-4 min-h-[56px] w-full bg-surface border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="peer sr-only" name="question12" type="radio" value="A"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant mr-4 flex-shrink-0 peer-checked:border-primary-container peer-checked:bg-primary-container flex justify-center items-center transition-colors">
<div class="w-2.5 h-2.5 bg-surface rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<div class="flex-1 font-body-lg text-body-lg text-on-surface">
                    β = 60°, c = 12 cm
                </div>
</label>
<!-- Option B (Selected) -->
<label class="flex items-center p-4 min-h-[56px] w-full bg-primary-fixed border-2 border-primary-container rounded-lg cursor-pointer transition-colors">
<input checked="" class="peer sr-only" name="question12" type="radio" value="B"/>
<div class="w-5 h-5 rounded-full border-2 border-primary-container mr-4 flex-shrink-0 bg-primary-container flex justify-center items-center">
<div class="w-2.5 h-2.5 bg-surface rounded-full opacity-100"></div>
</div>
<div class="flex-1 font-body-lg text-body-lg text-on-primary-container font-medium">
                    β = 80°, c = 10.78 cm
                </div>
</label>
<!-- Option C (Unselected) -->
<label class="flex items-center p-4 min-h-[56px] w-full bg-surface border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="peer sr-only" name="question12" type="radio" value="C"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant mr-4 flex-shrink-0 peer-checked:border-primary-container peer-checked:bg-primary-container flex justify-center items-center transition-colors">
<div class="w-2.5 h-2.5 bg-surface rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<div class="flex-1 font-body-lg text-body-lg text-on-surface">
                    β = 40°, c = 8 cm
                </div>
</label>
<!-- Option D (Unselected) -->
<label class="flex items-center p-4 min-h-[56px] w-full bg-surface border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="peer sr-only" name="question12" type="radio" value="D"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant mr-4 flex-shrink-0 peer-checked:border-primary-container peer-checked:bg-primary-container flex justify-center items-center transition-colors">
<div class="w-2.5 h-2.5 bg-surface rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<div class="flex-1 font-body-lg text-body-lg text-on-surface">
                    β = 90°, c = 14.4 cm
                </div>
</label>
</section>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 w-full bg-surface border-t border-outline-variant z-50 px-screen-margin py-stack-md flex flex-col gap-2 shadow-[0_-4px_24px_rgba(0,0,0,0.05)]">
<!-- Save Status -->
<div class="flex items-center justify-center gap-1.5 w-full text-on-surface-variant font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed-dim">check_circle</span>
            Answers saved on this device
        </div>
<!-- Action Buttons -->
<div class="flex justify-between items-center gap-4 w-full">
<button class="h-12 px-6 bg-transparent border border-primary-container text-primary-container font-label-lg text-label-lg rounded-full hover:bg-primary-fixed transition-colors flex items-center justify-center">
                Previous
            </button>
<button aria-label="Grid view" class="w-12 h-12 bg-surface-container-low border border-outline-variant rounded-full flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">grid_view</span>
</button>
<button class="h-12 px-8 bg-[#feae2c] text-[#1b1c1c] font-label-lg text-label-lg rounded-full hover:brightness-95 transition-all flex items-center justify-center font-bold">
                Next
            </button>
</div>
</footer>
</body></html>
