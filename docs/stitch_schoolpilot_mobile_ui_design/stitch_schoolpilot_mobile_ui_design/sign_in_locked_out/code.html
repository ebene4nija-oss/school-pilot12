<!DOCTYPE html>

<html lang="en"><head>

                    borderRadius: {

<body class="bg-background text-on-background font-body-lg min-h-screen flex items-center justify-center p-screen-margin">
<div class="w-full max-w-md bg-surface-lowest border border-outline-variant rounded-lg p-stack-lg shadow-none flex flex-col gap-stack-lg">
<!-- Header -->
<div class="text-center space-y-stack-sm">
<h1 class="font-headline-lg text-headline-lg text-primary">SchoolPilot</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your institution.</p>
</div>
<!-- Locked Warning -->
<div class="bg-error-container border border-error rounded p-stack-sm flex items-start gap-stack-sm" role="alert">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="font-body-md text-body-md text-on-error-container font-medium pt-1">
                Too many attempts. Try again in a minute.
            </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative group">
<input class="peer w-full h-[56px] px-unit pt-stack-sm pb-1 border border-outline-variant rounded bg-surface-bright text-on-surface focus:outline-none focus:border-primary-container focus:border-2 transition-all disabled:opacity-50" disabled="" id="email" placeholder=" " type="email" value="admin@example.edu"/>
<label class="absolute left-unit top-[18px] font-body-md text-body-md text-outline peer-focus:top-1 peer-focus:text-[10px] peer-focus:text-primary-container peer-valid:top-1 peer-valid:text-[10px] transition-all duration-200 pointer-events-none" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="relative group">
<input class="peer w-full h-[56px] px-unit pt-stack-sm pb-1 border border-outline-variant rounded bg-surface-bright text-on-surface focus:outline-none focus:border-primary-container focus:border-2 transition-all disabled:opacity-50" disabled="" id="password" placeholder=" " type="password" value="********"/>
<label class="absolute left-unit top-[18px] font-body-md text-body-md text-outline peer-focus:top-1 peer-focus:text-[10px] peer-focus:text-primary-container peer-valid:top-1 peer-valid:text-[10px] transition-all duration-200 pointer-events-none" for="password">Password</label>
</div>
<div class="flex justify-end">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<!-- Disabled Button -->
<button class="h-[48px] w-full rounded-full bg-surface-variant text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 cursor-not-allowed opacity-70" disabled="" type="submit">
<span class="material-symbols-outlined text-[20px]">lock_clock</span>
                Account Locked Temporarily
            </button>
</form>
</div>
</body></html>
