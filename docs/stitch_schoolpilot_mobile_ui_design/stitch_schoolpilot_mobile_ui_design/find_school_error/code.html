<style>
        /* Modern Corporate Functionalism Styles */
        body {
            background-color: #fcf9f8; /* background */
            color: #1b1c1b; /* on-background */
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Floating Label Input Logic */
        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .floating-input {
            width: 100%;
            height: 56px;
            padding: 24px 16px 8px 16px; /* Space for floating label */
            border: 1px solid #c3c6cf; /* outline-variant */
            background-color: #ffffff; /* on-primary */
            border-radius: 0.125rem; /* DEFAULT radius */
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 24px;
            color: #1b1c1b; /* on-surface */
            outline: none;
            transition: all 0.2s ease;
        }

        /* Error state overrides */
        .floating-input.error {
            border-color: #ba1a1a; /* error */
            border-width: 2px;
        }

        .floating-input:focus {
            border-color: #ba1a1a; /* maintains error color on focus if error class present */
        }
        
        /* If not error and focused */
        .floating-input:not(.error):focus {
            border: 2px solid #002447; /* primary-container */
        }

        .floating-label {
            position: absolute;
            top: 18px;
            left: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 24px;
            color: #43474e; /* on-surface-variant */
            pointer-events: none;
            transition: all 0.2s ease;
        }
        
        .floating-label.error {
            color: #ba1a1a; /* error */
        }

        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            top: 8px;
            font-size: 12px;
            line-height: 16px;
            font-weight: 500;
        }
        
        /* Interactive element transitions */
        .btn-primary {
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-ghost {
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-screen-margin bg-background">
<!-- Suppressed Shell: Linear/Transactional intent (Identification screen) -->
<!-- Main Content Canvas -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant p-stack-lg flex flex-col gap-stack-lg rounded">
<!-- Header Section -->
<header class="flex flex-col gap-unit items-center text-center">
<!-- Brand Mark / Icon Placeholder -->
<div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center border border-outline-variant mb-unit">
<span aria-hidden="true" class="material-symbols-outlined text-4xl text-primary-container" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    school
                </span>
</div>
<!-- Exact string match requested: "School code" related context -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                Find your school
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter your unique school code to access SchoolPilot.
            </p>
</header>
<!-- Form Section (Error State) -->
<form class="flex flex-col gap-stack-lg" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-unit">
<!-- Floating Label Input -->
<div class="input-wrapper">
<!-- placeholder=" " is required for the CSS :placeholder-shown hack -->
<input aria-describedby="schoolCode-error" aria-invalid="true" class="floating-input error" id="schoolCode" placeholder=" " type="text" value="NG-12345"/>
<label class="floating-label error" for="schoolCode">School code</label>
</div>
<!-- Helper / Error Text -->
<div class="flex items-center gap-unit text-error font-body-md text-body-md" id="schoolCode-error">
<span aria-hidden="true" class="material-symbols-outlined text-sm">error</span>
<span>We couldn't find a school with that code.</span>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-md mt-unit">
<!-- Primary Button (Amber/Yellow as requested) -->
<!-- Note: The prompt requested "Amber primary button". I am using the provided secondary-container (#ffc16a) which acts as the yellow/amber accent in the provided palette, paired with on-secondary-container text for contrast. -->
<button class="btn-primary w-full h-[48px] bg-secondary-container text-on-secondary-container font-label-lg text-label-lg rounded-full flex items-center justify-center" type="submit">
                    Continue
                </button>
</div>
</form>
<!-- Ghost Link & Hint -->
<div class="flex flex-col items-center gap-unit mt-stack-md pt-stack-md border-t border-surface-variant">
<button class="btn-ghost px-4 py-2 border border-primary-container text-primary-container bg-transparent font-label-lg text-label-lg rounded-full w-full" type="button">
                I don't know my code
            </button>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-unit">
                Your school code is in your invite SMS or email.
            </p>
</div>
</main>
<!-- Footer -->
<footer class="mt-stack-lg w-full max-w-md text-center">
<p class="font-label-sm text-label-sm text-outline">
            SchoolPilot — for Nigerian schools
        </p>
</footer>
</body></html>
