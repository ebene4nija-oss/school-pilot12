<style>

<body class="bg-surface-bright min-h-screen flex items-center justify-center p-screen-margin font-body-lg text-on-surface antialiased">

<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface text-center">

<form class="w-full flex flex-col gap-stack-lg" onsubmit="event.preventDefault();">

<input class="w-full aspect-square text-center font-headline-md text-headline-md tabular-nums bg-surface-bright border border-outline-variant rounded-lg focus:border-primary-container focus:border-2 focus:ring-0 focus:outline-none transition-all text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-full aspect-square text-center font-headline-md text-headline-md tabular-nums bg-surface-bright border border-outline-variant rounded-lg focus:border-primary-container focus:border-2 focus:ring-0 focus:outline-none transition-all text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-full aspect-square text-center font-headline-md text-headline-md tabular-nums bg-surface-bright border border-outline-variant rounded-lg focus:border-primary-container focus:border-2 focus:ring-0 focus:outline-none transition-all text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-full aspect-square text-center font-headline-md text-headline-md tabular-nums bg-surface-bright border border-outline-variant rounded-lg focus:border-primary-container focus:border-2 focus:ring-0 focus:outline-none transition-all text-on-surface" inputmode="numeric" maxlength="1" type="text"/>

                    Verify

            </p>

</main>
<!-- Micro-interaction JS for code inputs -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('code-inputs');
            const inputs = container.querySelectorAll('input');

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Allow only numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // Handle paste event
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, inputs.length);
                    if (pastedData) {
                        pastedData.split('').forEach((char, i) => {
                            if (inputs[i]) {
                                inputs[i].value = char;
                                if (i < inputs.length - 1) inputs[i + 1].focus();
                                else inputs[i].focus();
                            }
                        });
                    }
                });
            });
        });
    </script>
