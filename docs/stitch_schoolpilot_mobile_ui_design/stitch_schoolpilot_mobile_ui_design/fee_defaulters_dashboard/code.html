<body class="bg-background text-on-background antialiased md:hidden h-screen flex flex-col font-body-md overflow-hidden">

<button aria-label="Menu" class="active:scale-95 duration-100 p-2 -ml-2 text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full">

</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed truncate flex-1 text-center">Defaulters</h1>

<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>

<p class="font-body-md opacity-90">Total Outstanding</p>

</div>

<div class="flex bg-surface-container-low rounded-lg p-1">
<button class="flex-1 py-1 px-2 text-center rounded-md bg-surface border border-outline-variant text-on-surface font-label-sm text-label-sm shadow-sm transition-all">All</button>
<button class="flex-1 py-1 px-2 text-center rounded-md text-on-surface-variant hover:bg-surface-container transition-all font-label-sm text-label-sm">1 Term</button>
<button class="flex-1 py-1 px-2 text-center rounded-md text-on-surface-variant hover:bg-surface-container transition-all font-label-sm text-label-sm">2+ Terms</button>
</div>
</div>

<!-- Row 1 -->
<div class="px-screen-margin py-stack-sm border-b border-outline-variant bg-surface-container-lowest flex items-center justify-between hover:bg-surface-container-low transition-colors group">
