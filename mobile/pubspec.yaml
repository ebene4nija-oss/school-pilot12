name: schoolpilot
description: SchoolPilot — one app for admins, teachers, students and parents.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State and routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Device
  connectivity_plus: ^6.1.0
  geolocator: ^13.0.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Content rendering — CBT questions carry HTML, images and LaTeX
  flutter_math_fork: ^0.7.2
  flutter_widget_from_html_core: ^0.15.2
  cached_network_image: ^3.4.1
  webview_flutter: ^4.10.0

  # Presentation
  fl_chart: ^0.69.2
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  # Runs the real SQLite engine on the desktop VM so the outbox is tested
  # against the same database the phone uses, not a mock of it.
  sqflite_common_ffi: ^2.3.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
